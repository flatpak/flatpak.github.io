{% extends "base.html" %}

{% block hero_class %} compact{% endblock %}

{% block hero %}
  <div>
    <h1>{{ page.title }}</h1>
    <p>{{ page.date | date(format="%d %B %Y") }}</p>
  </div>
{% endblock %}

{% block content %}
<div class="page-content">
  {{ page.content | safe }}
</div>
{% endblock %}
